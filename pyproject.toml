[project]
name = "i-love-pdf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vanou-suerte", email = "vanessa.pech@ign.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.19.0",
    "typer>=0.27.2",
]

[project.scripts]
i-love-pdf = "i_love_pdf:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
